<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wallet & Womb | Kenya Maternal & Newborn Health Accountability</title>
  <meta name="description" content="Kenya Maternal and Newborn Health spending accountability dashboard across 26 high-burden priority counties." />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              900: '#1e3a8a',
            }
          }
        }
      }
    };
  </script>

  <!-- React 18, ReactDOM, and Babel Standalone CDNs -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Ensure minimum 13px base font for accessibility */
    body {
      font-size: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0b1120;
      color: #f1f5f9;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // Optional API key placeholder if external integrations are added later
    const API_KEY_PLACEHOLDER = "";

    // -------------------------------------------------------------
    // Inline SVG Icons
    // -------------------------------------------------------------
    const IconMapPin = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
    );
    const IconLayers = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
    );
    const IconCheckCircle2 = ({ className = "w-4 h-4 text-emerald-400" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></svg>
    );
    const IconAlertTriangle = ({ className = "w-4 h-4 text-red-400" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    );
    const IconHelpCircle = ({ className = "w-4 h-4 text-amber-400" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    );
    const IconMinusCircle = ({ className = "w-4 h-4 text-slate-400" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    );
    const IconNewspaper = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6Z"/></svg>
    );
    const IconRadio = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"/></svg>
    );
    const IconDatabase = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
    );
    const IconChevronDown = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    );
    const IconChevronUp = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
    );
    const IconZoomIn = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
    );
    const IconZoomOut = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
    );
    const IconRotateCcw = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    );
    const IconShield = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    );
    const IconX = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    );
    const IconCopy = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
    );
    const IconCheck = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    );

    // -------------------------------------------------------------
    // Data Loading & Normalization
    // -------------------------------------------------------------
    // Uses the inlined COUNTIES_DATA constant when present (or fetches if on server)
    const rawData = window.__COUNTIES_DATA__ || window.COUNTIES_DATA;

    function normalizeCountyName(name) {
      if (!name) return "";
      let n = name.trim().toLowerCase();
      if (n === "nairobi city") n = "nairobi";
      if (n === "elgeyo-marakwet") n = "elgeyo marakwet";
      return n;
    }

    // -------------------------------------------------------------
    // Header Component
    // -------------------------------------------------------------
    function Header({ year, onYearChange, counts, selectedCountyId, onCountySelect, counties, onOpenTipModal }) {
      return (
        <header className="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-30 px-4 py-3">
          <div className="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center md:justify-between gap-3">
            <div>
              <div className="flex items-center gap-2">
                <span className="p-1.5 rounded-lg bg-red-950/60 border border-red-800 text-red-400">
                  <IconShield className="w-5 h-5" />
                </span>
                <h1 className="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                  Wallet & Womb
                  <span className="text-xs px-2 py-0.5 rounded bg-blue-900/50 text-blue-300 border border-blue-700/50 font-medium">KENYA</span>
                </h1>
              </div>
              <p className="text-xs text-slate-400 mt-0.5">
                Maternal & Newborn Health Spending Accountability Across 26 High-Burden Counties
              </p>
            </div>

            <div className="flex flex-wrap items-center gap-3">
              {/* Financial Year Selector */}
              <div className="flex items-center gap-2 bg-slate-800/80 px-2.5 py-1.5 rounded-lg border border-slate-700 text-xs">
                <span className="text-slate-400">Financial year:</span>
                <select
                  value={year}
                  onChange={(e) => onYearChange(e.target.value)}
                  className="bg-slate-900 text-white font-medium px-2 py-1 rounded border border-slate-700 focus:outline-none focus:border-blue-500"
                >
                  <option value="FY2022/23">FY2022/23</option>
                  <option value="FY2023/24">FY2023/24</option>
                  <option value="FY2024/25">FY2024/25</option>
                  <option value="FY2025/26">FY2025/26</option>
                </select>
              </div>

              {/* Status Summary Line */}
              <div className="text-xs text-slate-300 font-medium px-2.5 py-1.5 bg-slate-800/60 rounded-lg border border-slate-800 flex items-center gap-1.5">
                <span className="text-emerald-400 font-semibold">{counts.onTrack} on track</span>
                <span className="text-slate-600">·</span>
                <span className="text-red-400 font-semibold">{counts.lagging} lagging</span>
                {counts.dataInc > 0 && (
                  <>
                    <span className="text-slate-600">·</span>
                    <span className="text-amber-400 font-semibold">{counts.dataInc} data incomplete</span>
                  </>
                )}
                {counts.partial > 0 && (
                  <>
                    <span className="text-slate-600">·</span>
                    <span className="text-slate-400 font-semibold">{counts.partial} partial</span>
                  </>
                )}
              </div>

              {/* County Quick Selector */}
              <select
                value={selectedCountyId}
                onChange={(e) => onCountySelect(e.target.value)}
                className="bg-slate-800 text-slate-200 text-xs px-2.5 py-1.5 rounded-lg border border-slate-700 focus:outline-none"
              >
                {counties.map((c) => (
                  <option key={c.id} value={c.id}>
                    #{c.code ? String(c.code).padStart(2, '0') : ''} {c.name}
                  </option>
                ))}
              </select>

              {/* Tip Drop Button */}
              <button
                onClick={onOpenTipModal}
                className="flex items-center gap-1.5 text-xs bg-emerald-950/70 hover:bg-emerald-900 text-emerald-300 border border-emerald-700/60 px-3 py-1.5 rounded-lg font-medium transition"
              >
                <IconShield className="w-3.5 h-3.5" />
                <span>Tip Drop</span>
              </button>
            </div>
          </div>
        </header>
      );
    }

    // -------------------------------------------------------------
    // Main App Component
    // -------------------------------------------------------------
    function App() {
      const [year, setYear] = useState("FY2023/24");
      const [activeTab, setActiveTab] = useState("map-focus"); // "map-focus" | "story-board" | "data-sources"
      const [selectedCountyId, setSelectedCountyId] = useState("009"); // Default Mandera
      const [mapLayer, setMapLayer] = useState("budget-status"); // "budget-status" | "facility-delivery" | "skilled-delivery" | "anc4-visits"
      const [isTipModalOpen, setIsTipModalOpen] = useState(false);

      const countiesData = window.COUNTIES_DATA || {};
      const countiesList = countiesData.counties || [];
      const yearSummary = countiesData.yearSummary?.[year] || {};

      // Compute status counts for selected year
      const statusCounts = useMemo(() => {
        let onTrack = 0, lagging = 0, dataInc = 0, partial = 0;
        countiesList.forEach((c) => {
          const yrData = c.years?.[year] || {};
          const st = yrData.status || c.status;
          if (st === "on-track") onTrack++;
          else if (st === "lagging") lagging++;
          else if (st === "data-incomplete") dataInc++;
          else if (st === "partial") partial++;
        });
        return { onTrack, lagging, dataInc, partial };
      }, [countiesList, year]);

      const selectedCounty = useMemo(() => {
        return countiesList.find((c) => c.id === selectedCountyId) || countiesList[0];
      }, [countiesList, selectedCountyId]);

      return (
        <div className="flex flex-col min-h-screen">
          <Header
            year={year}
            onYearChange={setYear}
            counts={statusCounts}
            selectedCountyId={selectedCountyId}
            onCountySelect={setSelectedCountyId}
            counties={countiesList}
            onOpenTipModal={() => setIsTipModalOpen(true)}
          />

          {/* Reliability Note Banner */}
          {yearSummary.reliability && yearSummary.reliability !== "good" && yearSummary.note && (
            <div className="bg-amber-950/40 border-b border-amber-800/40 px-4 py-2 text-xs text-amber-200 text-center">
              <span className="font-semibold uppercase tracking-wider text-amber-400 mr-2">Notice ({year}):</span>
              {yearSummary.note}
            </div>
          )}

          {/* Tab Navigation */}
          <nav className="border-b border-slate-800 bg-slate-900/50 px-4">
            <div className="max-w-7xl mx-auto flex gap-6 text-sm">
              <button
                onClick={() => setActiveTab("map-focus")}
                className={`py-3 font-medium border-b-2 flex items-center gap-2 transition ${
                  activeTab === "map-focus"
                    ? "border-blue-500 text-blue-400"
                    : "border-transparent text-slate-400 hover:text-slate-200"
                }`}
              >
                <IconMapPin className="w-4 h-4" />
                Map & Focus
              </button>
              <button
                onClick={() => setActiveTab("story-board")}
                className={`py-3 font-medium border-b-2 flex items-center gap-2 transition ${
                  activeTab === "story-board"
                    ? "border-blue-500 text-blue-400"
                    : "border-transparent text-slate-400 hover:text-slate-200"
                }`}
              >
                <IconNewspaper className="w-4 h-4" />
                Story Board
              </button>
              <button
                onClick={() => setActiveTab("data-sources")}
                className={`py-3 font-medium border-b-2 flex items-center gap-2 transition ${
                  activeTab === "data-sources"
                    ? "border-blue-500 text-blue-400"
                    : "border-transparent text-slate-400 hover:text-slate-200"
                }`}
              >
                <IconDatabase className="w-4 h-4" />
                Data & Sources
              </button>
            </div>
          </nav>

          {/* Main Content Area */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6">
            {activeTab === "map-focus" && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                {/* Kenya Map with Layers */}
                <div className="lg:col-span-7 bg-slate-900/60 border border-slate-800 rounded-xl p-4">
                  <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
                    <span className="text-xs uppercase tracking-wider text-slate-400 font-semibold flex items-center gap-1.5">
                      <IconLayers className="w-4 h-4 text-blue-400" />
                      Map Layer
                    </span>
                    <select
                      value={mapLayer}
                      onChange={(e) => setMapLayer(e.target.value)}
                      className="bg-slate-800 text-xs text-slate-200 px-2.5 py-1.5 rounded border border-slate-700"
                    >
                      <option value="budget-status">Budget status ({year})</option>
                      <option value="facility-delivery">Births in a health facility</option>
                      <option value="skilled-delivery">Births with a skilled provider</option>
                      <option value="anc4-visits">Women with 4+ antenatal visits</option>
                    </select>
                  </div>

                  {/* Interactive SVG Kenya Map Container */}
                  <div className="h-[460px] w-full flex items-center justify-center bg-slate-950/70 rounded-lg relative overflow-hidden border border-slate-800">
                    <svg viewBox="33.8 -4.8 8.2 10.0" className="w-full h-full p-2">
                      {Object.entries(window.KENYA_ALL_GEO_PATHS || {}).map(([key, countyGeo]) => {
                        const isSelected = selectedCounty && (
                          selectedCounty.code === countyGeo.code ||
                          normalizeCountyName(selectedCounty.name) === normalizeCountyName(countyGeo.name)
                        );
                        const countyMatch = countiesList.find(c => 
                          c.code === countyGeo.code || 
                          normalizeCountyName(c.name) === normalizeCountyName(countyGeo.name)
                        );
                        
                        let fillColor = "#1e293b"; // non-priority default
                        if (countyMatch) {
                          const yr = countyMatch.years?.[year] || {};
                          const st = yr.status || countyMatch.status;
                          if (mapLayer === "budget-status") {
                            if (st === "on-track") fillColor = "#10b981";
                            else if (st === "lagging") fillColor = "#ef4444";
                            else if (st === "data-incomplete") fillColor = "#f59e0b";
                            else if (st === "partial") fillColor = "#64748b";
                          } else {
                            // Survey layers
                            const survey = countyMatch.survey || {};
                            let val = 0;
                            if (mapLayer === "facility-delivery") val = survey.facilityDeliveryPct;
                            if (mapLayer === "skilled-delivery") val = survey.skilledDeliveryPct;
                            if (mapLayer === "anc4-visits") val = survey.anc4VisitsPct;
                            fillColor = val >= 75 ? "#047857" : val >= 50 ? "#d97706" : "#b91c1c";
                          }
                        }

                        return (
                          <path
                            key={key}
                            d={countyGeo.path}
                            fill={fillColor}
                            stroke={isSelected ? "#38bdf8" : "#0f172a"}
                            strokeWidth={isSelected ? "0.05" : "0.015"}
                            className="cursor-pointer transition-opacity hover:opacity-80"
                            onClick={() => countyMatch && setSelectedCountyId(countyMatch.id)}
                          >
                            <title>{countyGeo.name}</title>
                          </path>
                        );
                      })}
                    </svg>
                  </div>
                  <p className="text-[11px] text-slate-500 mt-2">
                    Survey baseline data: Kenya Mini DHS 2025-26. Click any county to view detailed budget spending and reporting leads.
                  </p>
                </div>

                {/* Selected County Detail Card */}
                {selectedCounty && (
                  <div className="lg:col-span-5 bg-slate-900/80 border border-slate-800 rounded-xl p-5">
                    <div className="flex items-start justify-between">
                      <div>
                        <div className="text-xs uppercase tracking-wider text-slate-400 font-semibold">
                          Code #{String(selectedCounty.code).padStart(2, '0')} · {selectedCounty.region}
                        </div>
                        <h2 className="text-2xl font-bold text-white mt-0.5">{selectedCounty.name} County</h2>
                        <div className="text-xs text-slate-400 mt-0.5">
                          Capital: {selectedCounty.capital} · Population: {selectedCounty.population}
                        </div>
                      </div>
                      <span className={`text-xs px-2.5 py-1 rounded-full font-bold uppercase ${
                        (selectedCounty.years?.[year]?.status || selectedCounty.status) === 'on-track'
                          ? 'bg-emerald-950 text-emerald-400 border border-emerald-700'
                          : (selectedCounty.years?.[year]?.status || selectedCounty.status) === 'lagging'
                          ? 'bg-red-950 text-red-400 border border-red-700'
                          : 'bg-amber-950 text-amber-400 border border-amber-700'
                      }`}>
                        {(selectedCounty.years?.[year]?.status || selectedCounty.status).replace('-', ' ')}
                      </span>
                    </div>

                    {/* Headline */}
                    {selectedCounty.years?.[year]?.editorHeadline && (
                      <div className="mt-4 p-3 bg-slate-800/60 border-l-4 border-blue-500 rounded text-sm text-slate-200">
                        {selectedCounty.years[year].editorHeadline}
                      </div>
                    )}

                    {/* Financial Metrics */}
                    <div className="grid grid-cols-2 gap-3 mt-4">
                      <div className="bg-slate-950/70 p-3 rounded-lg border border-slate-800">
                        <div className="text-xs text-slate-400">Approved Budget</div>
                        <div className="text-lg font-bold text-blue-400 mt-0.5">
                          KES {selectedCounty.years?.[year]?.promisedBudgetKES || selectedCounty.promisedBudgetKES}M
                        </div>
                      </div>
                      <div className="bg-slate-950/70 p-3 rounded-lg border border-slate-800">
                        <div className="text-xs text-slate-400">Delivered / Spent</div>
                        <div className="text-lg font-bold text-emerald-400 mt-0.5">
                          KES {selectedCounty.years?.[year]?.deliveredBudgetKES || selectedCounty.deliveredBudgetKES}M
                        </div>
                      </div>
                      <div className="bg-slate-950/70 p-3 rounded-lg border border-slate-800">
                        <div className="text-xs text-slate-400">Absorption Rate</div>
                        <div className="text-lg font-bold text-white mt-0.5">
                          {selectedCounty.years?.[year]?.absorptionRate || selectedCounty.absorptionRate}%
                        </div>
                      </div>
                      <div className="bg-slate-950/70 p-3 rounded-lg border border-slate-800">
                        <div className="text-xs text-slate-400">Pending Funds</div>
                        <div className="text-lg font-bold text-amber-400 mt-0.5">
                          KES {selectedCounty.years?.[year]?.pendingDisbursementKES || selectedCounty.pendingDisbursementKES}M
                        </div>
                      </div>
                    </div>

                    {/* Story Leads Section */}
                    <div className="mt-5 pt-4 border-t border-slate-800">
                      <h3 className="text-xs uppercase tracking-wider text-slate-400 font-semibold mb-3">
                        Possible story leads ({year})
                      </h3>
                      <div className="space-y-3">
                        {(selectedCounty.years?.[year]?.leads || []).map((lead, idx) => (
                          <div key={idx} className="bg-slate-950/50 p-3 rounded-lg border border-slate-800/80">
                            <div className="text-xs font-semibold text-white">{lead.headline}</div>
                            {lead.type === "combined" && (
                              <span className="inline-block mt-1 text-[10px] bg-purple-950/60 text-purple-300 border border-purple-800 px-1.5 py-0.5 rounded">
                                Budget + Mini DHS survey
                              </span>
                            )}
                            <div className="text-xs text-slate-300 mt-1.5">
                              <span className="font-medium text-slate-400">Possible angle: </span>
                              {lead.question}
                            </div>
                          </div>
                        ))}
                      </div>
                      <p className="text-[11px] text-slate-500 mt-3 italic">
                        AI-assisted story leads can contain mistakes. They are prompts for reporting, not findings. Verify every figure against source documents and with officials before publishing.
                      </p>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* Story Board Tab */}
            {activeTab === "story-board" && (
              <div className="bg-slate-900/60 border border-slate-800 rounded-xl p-6">
                <h2 className="text-lg font-bold text-white mb-2">Editor Story Board ({year})</h2>
                <p className="text-xs text-slate-400 mb-6">
                  Priority investigative leads compiled from Controller of Budget reporting and Mini DHS health indicators.
                </p>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {(yearSummary.topLeads || []).map((lead, idx) => (
                    <div key={idx} className="bg-slate-950/60 border border-slate-800 rounded-lg p-4 flex flex-col justify-between">
                      <div>
                        <div className="text-xs font-bold text-blue-400 mb-1">{lead.county} County</div>
                        <h3 className="text-sm font-semibold text-white mb-2">{lead.headline}</h3>
                        <p className="text-xs text-slate-300 mb-3">{lead.detail}</p>
                      </div>
                      <div className="text-xs text-slate-400 border-t border-slate-800/80 pt-2">
                        <span className="font-semibold text-slate-300">Angle: </span>{lead.question}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Data & Sources Tab */}
            {activeTab === "data-sources" && (
              <div className="bg-slate-900/60 border border-slate-800 rounded-xl p-6 space-y-6">
                <div>
                  <h2 className="text-lg font-bold text-white mb-2">Data Sources & Methodologies</h2>
                  <p className="text-xs text-slate-400">
                    Understanding the twin pillars of the Wallet & Womb accountability platform.
                  </p>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div className="bg-slate-950/70 p-4 rounded-lg border border-slate-800">
                    <h3 className="text-sm font-bold text-blue-400 mb-2">Controller of Budget (OCOB)</h3>
                    <p className="text-xs text-slate-300 leading-relaxed">
                      County health budget allocations, exchequer releases, expenditure, and absorption rates across 26 high-burden priority counties covering FY2022/23 through FY2025/26.
                    </p>
                  </div>
                  <div className="bg-slate-950/70 p-4 rounded-lg border border-slate-800">
                    <h3 className="text-sm font-bold text-emerald-400 mb-2">Kenya Mini DHS 2025-26</h3>
                    <p className="text-xs text-slate-300 leading-relaxed">
                      Static maternal and newborn health survey baseline, tracking facility deliveries, skilled birth attendants, and 4+ ANC visit rates across counties.
                    </p>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Verbatim Disclaimer Footer */}
          <footer className="border-t border-slate-800 bg-slate-950 py-4 px-6 text-center text-xs text-slate-500">
            Preliminary data, being verified against Controller of Budget reports. County health budgets, not maternal-specific spending. Survey data: Kenya Mini DHS 2025-26.
          </footer>
        </div>
      );
    }

    // Render the React application
    const rootElement = document.getElementById("root");
    ReactDOM.createRoot(rootElement).render(<App />);
  </script>
</body>
</html>
